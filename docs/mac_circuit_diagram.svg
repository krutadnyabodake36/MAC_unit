<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-ctrl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-clk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="0.5">Proposed Zero-Skipping Low-Power MAC Architecture</text>
  <text x="600" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">Exact Gate-Level &amp; Register Schematic (Pure Hardware Implementation)</text>

  <!-- ===================================================================== -->
  <!-- 1. ACTIVITY DETECTOR REGION (Green Tint)                               -->
  <!-- ===================================================================== -->
  <rect x="220" y="95" width="230" height="230" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="235" y="118" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.5">ACTIVITY DETECTOR</text>

  <!-- NOR Gate A (in_a == 0) -->
  <g transform="translate(250, 135)">
    <!-- IEEE NOR Symbol -->
    <path d="M 0,0 C 15,10 15,30 0,40 C 25,40 50,30 65,20 C 50,10 25,0 0,0 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="71" cy="20" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="25" y="25" font-size="11" font-weight="600" fill="#0f172a">~|A</text>
  </g>
  <text x="335" y="160" font-size="11" font-weight="600" fill="#166534">a_is_zero</text>

  <!-- NOR Gate B (in_b == 0) -->
  <g transform="translate(250, 245)">
    <!-- IEEE NOR Symbol -->
    <path d="M 0,0 C 15,10 15,30 0,40 C 25,40 50,30 65,20 C 50,10 25,0 0,0 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="71" cy="20" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="25" y="25" font-size="11" font-weight="600" fill="#0f172a">~|B</text>
  </g>
  <text x="335" y="270" font-size="11" font-weight="600" fill="#166534">b_is_zero</text>

  <!-- OR Gate (is_zero = a_is_zero | b_is_zero) -->
  <g transform="translate(370, 190)">
    <!-- IEEE OR Symbol -->
    <path d="M 0,0 C 15,10 15,30 0,40 C 25,40 50,30 65,20 C 50,10 25,0 0,0 Z" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="25" y="25" font-size="11" font-weight="600" fill="#0f172a">OR</text>
  </g>
  <text x="445" y="205" font-size="12" font-weight="700" fill="#dc2626">is_zero</text>


  <!-- ===================================================================== -->
  <!-- 2. OPERAND ISOLATION (MUXES) REGION (Blue Tint)                       -->
  <!-- ===================================================================== -->
  <rect x="220" y="375" width="160" height="240" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="235" y="398" font-size="12" font-weight="700" fill="#1e40af" letter-spacing="0.5">OPERAND ISOLATION</text>

  <!-- MUX A -->
  <g transform="translate(260, 420)">
    <polygon points="0,0 50,10 50,50 0,60" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
    <text x="8" y="20" font-size="10" fill="#64748b">0 (in_a)</text>
    <text x="8" y="48" font-size="10" fill="#64748b">1 (8'b0)</text>
    <text x="20" y="35" font-size="11" font-weight="700" fill="#1e293b">MUX</text>
    <!-- select pin at top -->
    <line x1="25" y1="5" x2="25" y2="-15" stroke="#dc2626" stroke-width="2"/>
    <text x="30" y="-3" font-size="10" font-weight="600" fill="#dc2626">S</text>
  </g>

  <!-- MUX B -->
  <g transform="translate(260, 525)">
    <polygon points="0,0 50,10 50,50 0,60" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
    <text x="8" y="20" font-size="10" fill="#64748b">0 (in_b)</text>
    <text x="8" y="48" font-size="10" fill="#64748b">1 (8'b0)</text>
    <text x="20" y="35" font-size="11" font-weight="700" fill="#1e293b">MUX</text>
    <!-- select pin at top -->
    <line x1="25" y1="5" x2="25" y2="-15" stroke="#dc2626" stroke-width="2"/>
    <text x="30" y="-3" font-size="10" font-weight="600" fill="#dc2626">S</text>
  </g>


  <!-- ===================================================================== -->
  <!-- 3. ARITHMETIC CORE: MULTIPLIER, ADDER, ACCUMULATOR                     -->
  <!-- ===================================================================== -->

  <!-- Multiplier Block (8x8 Signed Array) -->
  <g transform="translate(450, 440)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="130" height="28" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <text x="65" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">8×8 MULTIPLIER</text>
    <text x="65" y="65" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Signed Array</text>
    <text x="65" y="85" text-anchor="middle" font-size="11" fill="#64748b">Booth / Wallace</text>
    <text x="65" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Froze when S=1</text>
  </g>

  <!-- 32-bit Adder Block -->
  <g transform="translate(660, 425)">
    <!-- Trapezoid Adder symbol -->
    <polygon points="0,0 70,25 70,135 0,160" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="75" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">+</text>
    <text x="35" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">32-bit</text>
    <text x="35" y="110" text-anchor="middle" font-size="10" fill="#64748b">Adder</text>
  </g>

  <!-- 32-bit Accumulator Register -->
  <g transform="translate(820, 395)">
    <rect x="0" y="0" width="160" height="220" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="160" height="30" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">ACCUMULATOR REG</text>
    
    <!-- Pin Labels -->
    <text x="15" y="65" font-size="12" font-weight="700" fill="#1e293b">D [31:0]</text>
    <text x="135" y="65" font-size="12" font-weight="700" fill="#1e293b" text-anchor="end">Q [31:0]</text>

    <!-- Clock pin -->
    <polygon points="0,110 12,118 0,126" fill="none" stroke="#1e293b" stroke-width="2"/>
    <text x="18" y="122" font-size="11" font-weight="600" fill="#475569">CLK</text>

    <!-- Synchronous Clear pin -->
    <text x="15" y="165" font-size="11" font-weight="600" fill="#475569">CLR (clr)</text>

    <!-- Clock Enable Pin -->
    <text x="15" y="198" font-size="12" font-weight="700" fill="#16a34a">CE (accum_ce)</text>
    <rect x="12" y="185" width="135" height="20" fill="#dcfce7" rx="4" z-index="-1" opacity="0.6"/>
  </g>

  <!-- Inverter for Clock Enable (accum_ce = ~is_zero) -->
  <g transform="translate(680, 245)">
    <!-- Inverter Triangle -->
    <polygon points="0,0 24,12 0,24" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <circle cx="28" cy="12" r="4" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="-5" y="-5" font-size="11" font-weight="700" fill="#16a34a">NOT</text>
  </g>


  <!-- ===================================================================== -->
  <!-- 4. SIGNALS, WIRING, AND BUS ANNOTATIONS                               -->
  <!-- ===================================================================== -->

  <!-- Primary Input: in_a [7:0] -->
  <line x1="40" y1="150" x2="160" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="160" y1="150" x2="250" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="160" cy="150" r="4" fill="#2563eb"/>
  <line x1="160" y1="150" x2="160" y2="435" stroke="#2563eb" stroke-width="3"/>
  <line x1="160" y1="435" x2="260" y2="435" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Bus Slash -->
  <line x1="90" y1="145" x2="100" y2="155" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="140" font-size="11" font-weight="700" fill="#2563eb">8</text>
  <text x="40" y="140" font-size="13" font-weight="700" fill="#0f172a">in_a [7:0]</text>

  <!-- Primary Input: in_b [7:0] -->
  <line x1="40" y1="260" x2="130" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="130" y1="260" x2="250" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="130" cy="260" r="4" fill="#2563eb"/>
  <line x1="130" y1="260" x2="130" y2="540" stroke="#2563eb" stroke-width="3"/>
  <line x1="130" y1="540" x2="260" y2="540" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Bus Slash -->
  <line x1="75" y1="255" x2="85" y2="265" stroke="#2563eb" stroke-width="2"/>
  <text x="77" y="250" font-size="11" font-weight="700" fill="#2563eb">8</text>
  <text x="40" y="250" font-size="13" font-weight="700" fill="#0f172a">in_b [7:0]</text>

  <!-- NOR outputs to OR input -->
  <path d="M 326 155 L 348 155 L 348 200 L 370 200" fill="none" stroke="#166534" stroke-width="2"/>
  <path d="M 326 265 L 348 265 L 348 220 L 370 220" fill="none" stroke="#166534" stroke-width="2"/>

  <!-- Control Line: is_zero -->
  <path d="M 440 210 L 510 210" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="510" cy="210" r="4" fill="#dc2626"/>
  
  <!-- Branch to MUX A and B Select Lines -->
  <path d="M 510 210 L 510 360 L 285 360 L 285 405" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  <circle cx="285" cy="360" r="4" fill="#dc2626"/>
  <path d="M 285 360 L 285 510" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>

  <!-- Branch to Inverter (Clock Enable generation) -->
  <path d="M 510 210 L 510 257 L 680 257" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-ctrl)"/>
  
  <!-- Inverter output: accum_ce line to CE pin of Accumulator -->
  <path d="M 712 257 L 780 257 L 780 592 L 820 592" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="730" y="248" font-size="11" font-weight="700" fill="#16a34a">accum_ce = !is_zero</text>

  <!-- MUX Outputs (iso_a, iso_b) to Multiplier -->
  <line x1="310" y1="450" x2="450" y2="450" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="365" y1="445" x2="375" y2="455" stroke="#2563eb" stroke-width="2"/>
  <text x="367" y="440" font-size="11" font-weight="700" fill="#2563eb">8</text>
  <text x="330" y="440" font-size="11" font-weight="600" fill="#1e40af">iso_a [7:0]</text>

  <line x1="310" y1="555" x2="450" y2="555" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="365" y1="550" x2="375" y2="560" stroke="#2563eb" stroke-width="2"/>
  <text x="367" y="545" font-size="11" font-weight="700" fill="#2563eb">8</text>
  <text x="330" y="545" font-size="11" font-weight="600" fill="#1e40af">iso_b [7:0]</text>

  <!-- Multiplier 16-bit Product to Adder (with Sign Extension) -->
  <line x1="580" y1="505" x2="660" y2="505" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="500" x2="620" y2="510" stroke="#2563eb" stroke-width="2"/>
  <text x="612" y="495" font-size="11" font-weight="700" fill="#2563eb">16</text>
  <text x="590" y="490" font-size="11" font-weight="600" fill="#0f172a">prod [15:0]</text>
  <text x="590" y="525" font-size="9" fill="#64748b">(Sign-ext to 32)</text>

  <!-- Adder Output to Accumulator D input -->
  <line x1="730" y1="505" x2="820" y2="505" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="500" x2="775" y2="510" stroke="#2563eb" stroke-width="2"/>
  <text x="767" y="495" font-size="11" font-weight="700" fill="#2563eb">32</text>
  <text x="740" y="490" font-size="11" font-weight="600" fill="#0f172a">sum [31:0]</text>

  <!-- Clock & Clear Inputs -->
  <line x1="750" y1="518" x2="820" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow-clk)"/>
  <text x="710" y="522" font-size="11" font-weight="600" fill="#475569">clk (100MHz)</text>

  <line x1="750" y1="560" x2="820" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#arrow-clk)"/>
  <text x="730" y="564" font-size="11" font-weight="600" fill="#475569">clr</text>

  <!-- Accumulator Output: out_mac [31:0] and Feedback Loop -->
  <line x1="980" y1="460" x2="1140" y2="460" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="455" x2="1050" y2="465" stroke="#2563eb" stroke-width="2"/>
  <text x="1042" y="450" font-size="11" font-weight="700" fill="#2563eb">32</text>
  <text x="1005" y="445" font-size="14" font-weight="700" fill="#0f172a">out_mac [31:0]</text>
  <text x="1005" y="480" font-size="11" fill="#64748b">(Final MAC Output)</text>

  <!-- Feedback Line to Adder -->
  <circle cx="1020" cy="460" r="4" fill="#2563eb"/>
  <path d="M 1020 460 L 1020 370 L 640 370 L 640 455 L 660 455" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="362" font-size="11" font-weight="600" fill="#2563eb">Feedback Accumulator Loop [31:0]</text>

  <!-- ===================================================================== -->
  <!-- 5. LEGEND & ANNOTATIONS BOX                                           -->
  <!-- ===================================================================== -->
  <g transform="translate(40, 620)">
    <rect x="0" y="0" width="1120" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="27" font-size="11" font-weight="700" fill="#0f172a">KEY HARDWARE RULES:</text>
    <circle cx="180" cy="23" r="5" fill="#2563eb"/>
    <text x="192" y="27" font-size="11" fill="#334155">Data Busses ([7:0], [15:0], [31:0])</text>
    <circle cx="430" cy="23" r="5" fill="#dc2626"/>
    <text x="442" y="27" font-size="11" fill="#334155">Zero-Detection Control Wire (is_zero)</text>
    <circle cx="700" cy="23" r="5" fill="#16a34a"/>
    <text x="712" y="27" font-size="11" fill="#334155">Inferred Clock-Enable (accum_ce to Slice CE)</text>
    <text x="980" y="27" font-size="11" font-weight="600" fill="#64748b">Fmax = 358.94 MHz</text>
  </g>
</svg>
